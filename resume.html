<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume — Jonah Abbott</title>
    <meta name="description" content="Resume of Jonah Abbott" />
    <link rel="stylesheet" href="style.css">
    <style>
      .resume-actions { display:flex; gap: .75rem; justify-content: center; margin: 1rem 0 1.5rem; }
      .resume-frame-wrapper {
        width: min(1280px, 78%);
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      }
      /* toolbar/navpanes=0 hides the browser's built-in PDF chrome so it reads like part of the page.
         A fixed numeric zoom is used instead of "fit width" because Chrome's PDF viewer doesn't reliably
         recompute fit-to-width against an iframe's actual CSS size; the tall frame + scroll reveals the rest. */
      .resume-frame { width: 100%; height: 92vh; border: none; display: block; }
      .note { text-align:center; color: var(--muted-text); font-size: .9rem; margin-top: .75rem; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="resume.html" aria-current="page">Resume</a></li>
      </ul>
    </nav>

    <main id="main">
      <div class="resume-actions">
        <a class="btn primary" href="resumes/jonahresume-august2026.pdf" target="_blank" rel="noopener">Open in New Tab</a>
        <a class="btn" href="resumes/jonahresume-august2026.pdf" download="Jonah Abbott Resume.pdf">Download PDF</a>
      </div>

      <div class="resume-frame-wrapper">
        <!-- Embed the latest resume PDF. All resume versions live in resumes/; this points at the current one.
             toolbar=0&navpanes=0&scrollbar=0 strips the native PDF viewer chrome for a cleaner in-page look. -->
        <iframe class="resume-frame" src="resumes/jonahresume-august2026.pdf#toolbar=0&navpanes=0&view=FitH" title="Jonah Abbott resume preview"></iframe>
      </div>

      <p class="note">If the preview doesn't load, use "Open in New Tab" or "Download PDF" above.</p>
    </main>
  </body>
</html>
